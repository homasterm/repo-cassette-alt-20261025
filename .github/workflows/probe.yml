name: Repo Cassette cache route probe
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/save@v4
        with:
          path: cache-payload.json
          key: repo-cassette-${{ github.run_id }}
