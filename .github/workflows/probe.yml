name: Repo Cassette artifact response-type differential
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
  security-events: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned probe dependencies
        run: npm ci
      - uses: ./probe-action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
