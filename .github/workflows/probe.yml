name: Repo Cassette omitted MIME probe
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - uses: ./probe-action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
